name: APK derle
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create --platforms=android --org com.kisisel --project-name benim_muzik .
      - run: python3 tools/patch.py
      - name: Gradle JVM ayari
        run: printf '\nkotlin.jvm.target.validation.mode=warning\n' >> android/gradle.properties
      - run: flutter pub get
      - name: Eklenti uyumluluk düzeltmesi
        run: |
          for f in $(find ~/.pub-cache -path '*on_audio_query_android*/android/build.gradle'); do
            grep -q namespace "$f" || sed -i "s/^android {/android {\n    namespace 'com.lucasjosino.on_audio_query'/" "$f"
          done
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: muzik-apk
          path: build/app/outputs/flutter-apk/app-release.apk
